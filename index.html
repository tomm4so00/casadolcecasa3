<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sims Apartment - Online Multiplayer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f0f15; color: white; touch-action: none; }

    #game-canvas { width: 100vw; height: 100vh; display: block; background: #12121c; }

    /* HUD Barre Fabbisogni con Etichette */
    .needs-hud-container { position: absolute; top: 8px; left: 8px; background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(8px); border-radius: 8px; padding: 4px 6px; width: 125px; border: 1px solid rgba(255,255,255,0.15); z-index: 40; display: flex; flex-direction: column; gap: 2px; }
    .need-row { display: flex; flex-direction: column; }
    .need-info { font-size: 0.50rem; font-weight: bold; margin-bottom: 1px; display: flex; justify-content: space-between; }
    .bar-bg { height: 3px; background: #222; border-radius: 2px; overflow: hidden; }
    .bar-fill { height: 100%; transition: width 0.2s linear; }

    #health-bar-fill { background: #ff4757; }
    #sleep-bar-fill { background: #54a0ff; }
    #hunger-bar-fill { background: #ff9f43; }
    #hygiene-bar-fill { background: #1dd1a1; }
    #happiness-bar-fill { background: #ff6b6b; }
    #money-bar-fill { background: #2ed573; }

    /* Touch Controls / Mouse Input Zone */
    #left-touch-zone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: auto; }

    #dynamic-joystick { position: absolute; width: 100px; height: 100px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; background: rgba(0,0,0,0.3); display: none; pointer-events: none; transform: translate(-50%, -50%); z-index: 30; }
    #joystick-knob { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; background: rgba(255, 255, 255, 0.8); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(0,0,0,0.5); }

    .hud-controls { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 40; pointer-events: auto; }
    .btn-hud { width: 50px; height: 50px; border-radius: 50%; background: rgba(30, 30, 40, 0.85); border: 2px solid rgba(255,255,255,0.3); color: white; font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); cursor: pointer; }
    .btn-hud.active { background: #2e86de; border-color: #54a0ff; }

    /* Setup UI */
    #ui-setup-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0a0a0e; z-index: 999; display: flex; justify-content: center; align-items: center; pointer-events: auto; }
    .card { background: rgba(25, 25, 35, 0.95); border-radius: 16px; padding: 24px; width: 90%; max-width: 380px; border: 1px solid rgba(255,255,255,0.15); text-align: center; }
    .input-group { margin: 15px 0; text-align: left; }
    label { font-size: 0.85rem; color: #aaa; margin-bottom: 5px; display: block; }
    input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #1a1a22; color: white; font-size: 1rem; }
    .btn-primary { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #ff4757; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .btn-primary:active { background: #ff6b81; }

    /* Interazione Popups */
    .popup-interact { position: absolute; top: 22%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; gap: 6px; z-index: 50; pointer-events: auto; max-width: 90vw; }
    .btn-pop { background: #2ed573; border: none; color: white; padding: 10px 16px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
    .btn-pop-alt { background: #feca57; color: #111; }
    .btn-pop-action { background: #ff9f43; color: white; }
    .btn-pop-exit { background: #9b59b6; color: white; }
    .btn-pop-locked { background: #718093 !important; cursor: not-allowed; }

    #btn-return-home { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2e86de; color: white; padding: 14px 28px; border: 2px solid #fff; border-radius: 30px; font-weight: bold; font-size: 1rem; z-index: 100; pointer-events: auto; box-shadow: 0 6px 20px rgba(0,0,0,0.8); cursor: pointer; }

    .fullscreen-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 500; pointer-events: auto; }
    .hidden { display: none !important; }
  </style>

  <!-- Includiamo Socket.io per la comunicazione online in tempo reale -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <!-- HUD CON 6 BARRE E ETICHETTE -->
  <div id="needs-hud" class="needs-hud-container hidden">
    <div class="need-row">
      <div class="need-info"><span>❤️ Salute</span><span id="health-text">50%</span></div>
      <div class="bar-bg"><div id="health-bar-fill" class="bar-fill" style="width: 50%;"></div></div>
    </div>
    <div class="need-row">
      <div class="need-info"><span>😴 Sonno</span><span id="sleep-text">50%</span></div>
      <div class="bar-bg"><div id="sleep-bar-fill" class="bar-fill" style="width: 50%;"></div></div>
    </div>
    <div class="need-row">
      <div class="need-info"><span>🍕 Fame</span><span id="hunger-text">50%</span></div>
      <div class="bar-bg"><div id="hunger-bar-fill" class="bar-fill" style="width: 50%;"></div></div>
    </div>
    <div class="need-row">
      <div class="need-info"><span>🧼 Igiene</span><span id="hygiene-text">50%</span></div>
      <div class="bar-bg"><div id="hygiene-bar-fill" class="bar-fill" style="width: 50%;"></div></div>
    </div>
    <div class="need-row">
      <div class="need-info"><span>🙂 Felicità</span><span id="happiness-text">50%</span></div>
      <div class="bar-bg"><div id="happiness-bar-fill" class="bar-fill" style="width: 50%;"></div></div>
    </div>
    <div class="need-row">
      <div class="need-info"><span>💰 Soldi</span><span id="money-text">50%</span></div>
      <div class="bar-bg"><div id="money-bar-fill" class="bar-fill" style="width: 50%;"></div></div>
    </div>
  </div>

  <div id="left-touch-zone"></div>
  <div id="dynamic-joystick"><div id="joystick-knob"></div></div>

  <div id="hud-actions" class="hud-controls hidden">
    <button class="btn-hud" id="btn-sprint" onclick="toggleSprint()">🏃</button>
  </div>

  <!-- POPUP DINAMICO DI INTERAZIONE -->
  <div id="pop-interaction" class="popup-interact hidden">
    <button class="btn-pop" id="btn-act-main" onclick="handleObjectInteract()">✋ Interagisci</button>
    <button class="btn-pop btn-pop-action hidden" id="btn-act-sub" onclick="handleSubAction()">🍎 Prendi Cibo</button>

    <button class="btn-pop btn-pop-exit hidden" id="btn-act-walk" onclick="doActivity('walk')">🚶 Passeggiata nel Parco (+10% Felicità, +5% Salute)</button>
    <button class="btn-pop btn-pop-exit hidden" id="btn-act-bar" onclick="doActivity('bar')">☕ Bar all'Aperto (+15% Felicità, -5% Soldi)</button>
    <button class="btn-pop btn-pop-exit hidden" id="btn-act-trip" onclick="doActivity('trip')">✈️ Viaggio (+70% Felicità, -20% Soldi)</button>
    <button class="btn-pop btn-pop-exit hidden" id="btn-act-work" onclick="doActivity('work')">💼 Ufficio High-Tech (+10% Soldi, -10% Felicità)</button>

    <button class="btn-pop btn-pop-alt hidden" id="btn-act-move" onclick="startMovingFurniture()">🖐️ Sposta Mobile</button>
  </div>

  <button id="btn-place-furniture" class="btn-pop hidden" style="position:absolute; bottom:30px; left:50%; transform:translateX(-50%); z-index:60;" onclick="placeFurniture()">📌 Lascia Mobile</button>
  <button id="btn-return-home" class="hidden" onclick="returnHomeFromActivity()">🏡 Torna a Casa</button>

  <div id="ui-setup-screen">
    <div class="card">
      <h2>Sims Apartment 3D</h2>
      <div class="input-group">
        <label>Nome Giocatore</label>
        <input type="text" id="nickname" value="Marco" placeholder="Inserisci il tuo nome...">
      </div>
      <button class="btn-primary" id="start-game-btn" type="button">Entra nel Gioco</button>
    </div>
  </div>

  <div id="wardrobe-modal" class="fullscreen-modal hidden">
    <div class="card" style="text-align:center;">
      <h2>🚪 Guardaroba</h2>
      <p style="margin: 15px 0; color:#ccc;">Cambio abiti completato!</p>
      <button class="btn-primary" onclick="closeModal('wardrobe-modal')">Chiudi</button>
    </div>
  </div>

  <div id="computer-modal" class="fullscreen-modal hidden">
    <div class="card" style="text-align:center;">
      <h2>💻 PC Privato</h2>
      <p style="margin: 15px 0; color:#ccc;">Desktop Windows Attivo.</p>
      <button class="btn-primary" onclick="closeModal('computer-modal')">Spegni PC</button>
    </div>
  </div>

  <script>
    // Connessione al server WebSocket pubblico per il multiplayer online
    const socket = io("https://websockets-server-demo.herokuapp.com" || "https://socket-io-chat.znet.fr" || "https://iframe-backend.glitch.me", {
      transports: ['websocket', 'polling'],
      forceNew: true
    });

    let otherPlayers = {};

    let activeEnvironment = 'SALOON';
    let currentRoomTitle = "Salone Principale";
    let canvas, ctx;
    
    let healthLevel = 50;
    let sleepLevel = 50;
    let hungerLevel = 50;
    let hygieneLevel = 50;
    let happinessLevel = 50;
    let moneyLevel = 50;
    let isSleeping = false;
    let isOutsideMenuOpen = false;

    let fridgeIsOpen = false;
    let fridgeAnimProgress = 0;

    let sleepGainedSinceLastHealthBoost = 0;

    const SLEEP_DEPLETION_SEC = 900;          
    const HUNGER_AWAKE_DEPLETION_SEC = 300;   
    const HUNGER_SLEEP_DEPLETION_SEC = 43200; 
    const HYGIENE_DEPLETION_SEC = 1800;      
    const HEALTH_DAMAGE_SEC = 120;

    let hasFoodInInventory = false;
    let foodIsCooked = false;

    let playerPos = { x: 0, y: 0 };
    let moveForward = 0, moveRight = 0;
    let isSprinting = false;

    let keysPressed = { w: false, a: false, s: false, d: false, arrowup: false, arrowleft: false, arrowdown: false, arrowright: false };

    let isMovingFurnitureMode = false;
    let movingPropKey = null;
    let activeTargetProp = null;

    let roomsState = [
      { id: 1, owner: null }, { id: 2, owner: null },
      { id: 3, owner: null }, { id: 4, owner: null },
      { id: 5, owner: null }, { id: 6, owner: null },
      { id: 7, owner: null }, { id: 8, owner: null }
    ];

    let joystickTouchId = null, joystickOrigin = { x: 0, y: 0 };
    let myData = { nick: 'Marco' };

    let playerRoomFurniture = {
      bed: { x: -120, y: -100, w: 80, h: 110, z: 40, name: "Letto di Lusso 🛏️", color: "#5f27cd", topColor: "#8854d0", moveable: true },
      wardrobe: { x: 120, y: -100, w: 80, h: 60, z: 135, name: "Armadio a Anta Doppia 🚪", color: "#1e272e", topColor: "#485460", moveable: true },
      desk: { x: 120, y: 40, w: 80, h: 70, z: 55, name: "Postazione Gaming & PC 💻", color: "#222f3e", topColor: "#576574", moveable: true },
      doorExit: { x: 0, y: 160, w: 60, h: 15, z: 110, name: "Uscita Salone", color: "#e74c3c", topColor: "#ff6b6b", moveable: false }
    };

    let kitchenFurniture = {
      stove: { x: -100, y: -100, w: 70, h: 70, z: 60, name: "Cucina Attrezzata 🍳", color: "#c0392b", topColor: "#e74c3c", moveable: false },
      fridge: { x: 100, y: -100, w: 70, h: 70, z: 140, name: "Frigorifero 🧊", color: "#bdc3c7", topColor: "#ecf0f1", moveable: false },
      doorExit: { x: 0, y: 160, w: 60, h: 15, z: 110, name: "Uscita Salone", color: "#e74c3c", topColor: "#ff6b6b", moveable: false }
    };

    let bathroomFurniture = {
      toilet: { x: -120, y: -80, w: 55, h: 55, z: 45, name: "Sanitario Moderno 🚽", color: "#f1f2f6", topColor: "#dfe4ea", moveable: false },
      sink: { x: 0, y: -120, w: 60, h: 50, z: 55, name: "Lavandino di Design 🚰", color: "#0984e3", topColor: "#74b9ff", moveable: false },
      shower: { x: 120, y: -80, w: 80, h: 80, z: 125, name: "Box Doccia Cristallo 🚿", color: "#00cec9", topColor: "#81ecec", moveable: false },
      doorExit: { x: 0, y: 160, w: 60, h: 15, z: 110, name: "Uscita Salone", color: "#e74c3c", topColor: "#ff6b6b", moveable: false }
    };

    let saloonDoors = {
      exitHouse: { x: 0, y: 180, w: 70, h: 15, z: 110, name: "Uscita di Casa 🚪" },
      kitchen: { x: -180, y: -100, w: 10, h: 60, z: 110, name: "Entra in Cucina 🍳", targetEnv: 'KITCHEN', title: "Cucina" },
      bathroom: { x: 180, y: -100, w: 10, h: 60, z: 110, name: "Entra in Bagno 🚽", targetEnv: 'BATHROOM', title: "Bagno" },
      room1: { x: -180, y: 0, w: 10, h: 50, z: 110, name: "Stanza 1", targetEnv: 'PLAYER_ROOM', roomIdx: 0 },
      room2: { x: -180, y: 100, w: 10, h: 50, z: 110, name: "Stanza 2", targetEnv: 'PLAYER_ROOM', roomIdx: 1 },
      room3: { x: 180, y: 0, w: 10, h: 50, z: 110, name: "Stanza 3", targetEnv: 'PLAYER_ROOM', roomIdx: 2 },
      room4: { x: 180, y: 100, w: 10, h: 50, z: 110, name: "Stanza 4", targetEnv: 'PLAYER_ROOM', roomIdx: 3 },
      room5: { x: -100, y: -180, w: 50, h: 10, z: 110, name: "Stanza 5", targetEnv: 'PLAYER_ROOM', roomIdx: 4 },
      room6: { x: 100, y: -180, w: 50, h: 10, z: 110, name: "Stanza 6", targetEnv: 'PLAYER_ROOM', roomIdx: 5 },
      room7: { x: -100, y: 180, w: 50, h: 10, z: 110, name: "Stanza 7", targetEnv: 'PLAYER_ROOM', roomIdx: 6 },
      room8: { x: 100, y: 180, w: 50, h: 10, z: 110, name: "Stanza 8", targetEnv: 'PLAYER_ROOM', roomIdx: 7 }
    };

    window.addEventListener('load', () => {
      canvas = document.getElementById('game-canvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();

      const startBtn = document.getElementById('start-game-btn');
      const triggerStart = (e) => {
        if (e) e.preventDefault();
        startGame();
      };

      startBtn.addEventListener('click', triggerStart);
      startBtn.addEventListener('touchstart', triggerStart);

      window.addEventListener('resize', resizeCanvas);

      // Gestione eventi online multiplayer via socket
      socket.on('player_move', (data) => {
        if (data.id !== socket.id) {
          otherPlayers[data.id] = data;
        }
      });

      socket.on('player_disconnected', (id) => {
        delete otherPlayers[id];
      });
    });

    function resizeCanvas() {
      if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    }

    function startGame() {
      const nickInput = document.getElementById('nickname');
      myData.nick = (nickInput && nickInput.value.trim()) ? nickInput.value.trim() : 'Marco';
      roomsState[0].owner = myData.nick;

      document.getElementById('ui-setup-screen').classList.add('hidden');
      document.getElementById('needs-hud').classList.remove('hidden');
      document.getElementById('hud-actions').classList.remove('hidden');

      setupControls();
      startLoop();
    }

    function setupControls() {
      window.addEventListener('keydown', (e) => {
        let k = e.key.toLowerCase();
        if (k === 'w' || e.code === 'ArrowUp') keysPressed.w = true;
        if (k === 's' || e.code === 'ArrowDown') keysPressed.s = true;
        if (k === 'a' || e.code === 'ArrowLeft') keysPressed.a = true;
        if (k === 'd' || e.code === 'ArrowRight') keysPressed.d = true;
        updateKeyboardMovement();
      });

      window.addEventListener('keyup', (e) => {
        let k = e.key.toLowerCase();
        if (k === 'w' || e.code === 'ArrowUp') keysPressed.w = false;
        if (k === 's' || e.code === 'ArrowDown') keysPressed.s = false;
        if (k === 'a' || e.code === 'ArrowLeft') keysPressed.a = false;
        if (k === 'd' || e.code === 'ArrowRight') keysPressed.d = false;
        updateKeyboardMovement();
      });

      const leftZone = document.getElementById('left-touch-zone');
      const joystickEl = document.getElementById('dynamic-joystick');
      const knobEl = document.getElementById('joystick-knob');

      leftZone.addEventListener('touchstart', (e) => {
        for (let touch of e.changedTouches) {
          if (joystickTouchId === null) {
            joystickTouchId = touch.identifier;
            joystickOrigin = { x: touch.clientX, y: touch.clientY };
            joystickEl.style.left = `${touch.clientX}px`;
            joystickEl.style.top = `${touch.clientY}px`;
            joystickEl.style.display = 'block';
          }
        }
      });

      leftZone.addEventListener('touchmove', (e) => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === joystickTouchId) {
            let dx = touch.clientX - joystickOrigin.x;
            let dy = touch.clientY - joystickOrigin.y;
            let dist = Math.hypot(dx, dy);
            let maxR = 40;
            if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
            knobEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            moveRight = dx / maxR;
            moveForward = -dy / maxR;
          }
        }
      });

      const resetJoy = (e) => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === joystickTouchId) {
            joystickTouchId = null;
            if (!isKeyActive()) { moveForward = 0; moveRight = 0; }
            joystickEl.style.display = 'none';
          }
        }
      };
      leftZone.addEventListener('touchend', resetJoy);
      leftZone.addEventListener('touchcancel', resetJoy);
    }

    function isKeyActive() {
      return keysPressed.w || keysPressed.s || keysPressed.a || keysPressed.d;
    }

    function updateKeyboardMovement() {
      let fwd = 0, rt = 0;
      if (keysPressed.w) fwd += 1;
      if (keysPressed.s) fwd -= 1;
      if (keysPressed.a) rt -= 1;
      if (keysPressed.d) rt += 1;

      if (fwd !== 0 || rt !== 0) {
        moveForward = fwd;
        moveRight = rt;
      } else if (joystickTouchId === null) {
        moveForward = 0;
        moveRight = 0;
      }
    }

    function toggleSprint() {
      isSprinting = !isSprinting;
      document.getElementById('btn-sprint').classList.toggle('active', isSprinting);
    }

    function getCurrentFurnitureMap() {
      if (activeEnvironment === 'PLAYER_ROOM') return playerRoomFurniture;
      if (activeEnvironment === 'KITCHEN') return kitchenFurniture;
      if (activeEnvironment === 'BATHROOM') return bathroomFurniture;
      if (activeEnvironment === 'SALOON') return saloonDoors;
      return {};
    }

    function checkProximity() {
      if (isMovingFurnitureMode) return;
      let map = getCurrentFurnitureMap();
      let found = null;

      Object.keys(map).forEach(key => {
        let obj = map[key];
        let d = Math.hypot(playerPos.x - obj.x, playerPos.y - obj.y);
        if (d < 65) found = key;
      });

      const pop = document.getElementById('pop-interaction');
      const btnMove = document.getElementById('btn-act-move');
      const btnMain = document.getElementById('btn-act-main');
      const btnSub = document.getElementById('btn-act-sub');

      const btnWalk = document.getElementById('btn-act-walk');
      const btnBar = document.getElementById('btn-act-bar');
      const btnTrip = document.getElementById('btn-act-trip');
      const btnWork = document.getElementById('btn-act-work');

      if (!isOutsideMenuOpen) {
        btnWalk.classList.add('hidden');
        btnBar.classList.add('hidden');
        btnTrip.classList.add('hidden');
        btnWork.classList.add('hidden');
      }

      if (found) {
        activeTargetProp = found;
        pop.classList.remove('hidden');
        let item = map[found];

        if (activeEnvironment === 'SALOON') {
          if (found === 'exitHouse') {
            if (!isOutsideMenuOpen) {
              btnMain.innerText = "🚪 Esci di Casa";
              btnMain.classList.remove('btn-pop-locked');
              btnSub.classList.add('hidden');
            } else {
              btnMain.innerText = "🚪 Chiudi Menu Uscita";
              btnWalk.classList.remove('hidden');
              btnBar.classList.remove('hidden');
              btnTrip.classList.remove('hidden');
              btnWork.classList.remove('hidden');
            }
          } else if (item.roomIdx !== undefined) {
            isOutsideMenuOpen = false;
            let room = roomsState[item.roomIdx];
            if (!room.owner) {
              btnMain.innerText = `🔒 Stanza Vuota (Chiusa)`;
              btnMain.classList.add('btn-pop-locked');
              btnMove.classList.add('hidden');
              btnSub.classList.add('hidden');
              return;
            } else {
              btnMain.innerText = `🚪 Entra nella Stanza di ${room.owner}`;
              btnMain.classList.remove('btn-pop-locked');
              btnSub.classList.add('hidden');
            }
          } else {
            isOutsideMenuOpen = false;
            btnMain.innerText = `✋ ${item.name}`;
            btnMain.classList.remove('btn-pop-locked');
            btnSub.classList.add('hidden');
          }
        } else if (activeEnvironment === 'KITCHEN') {
          btnMain.classList.remove('btn-pop-locked');
          if (found === 'fridge') {
            if (!fridgeIsOpen) {
              btnMain.innerText = "🧊 Apri Frigorifero";
              btnSub.classList.add('hidden');
            } else {
              btnMain.innerText = "🧊 Chiudi Frigorifero";
              if (!hasFoodInInventory) {
                btnSub.innerText = "🍎 Prendi Cibo";
                btnSub.classList.remove('hidden');
              } else {
                btnSub.classList.add('hidden');
              }
            }
          } else if (found === 'stove') {
            if (hasFoodInInventory && !foodIsCooked) {
              btnMain.innerText = "🍳 Cucina Cibo";
              btnSub.classList.add('hidden');
            } else if (foodIsCooked) {
              btnMain.innerText = "🍽️ Mangia";
              btnSub.classList.add('hidden');
            } else {
              btnMain.innerText = "🍳 Fornello (Serve Cibo)";
              btnSub.classList.add('hidden');
            }
          } else {
            btnMain.innerText = `✋ ${item.name}`;
            btnSub.classList.add('hidden');
          }
        } else if (activeEnvironment === 'PLAYER_ROOM' && found === 'bed') {
          btnMain.innerText = isSleeping ? "⏰ Svegliati" : "😴 Coricati a Letto";
          btnMain.classList.remove('btn-pop-locked');
          btnSub.classList.add('hidden');
        } else {
          btnMain.innerText = `✋ ${item.name}`;
          btnMain.classList.remove('btn-pop-locked');
          btnSub.classList.add('hidden');
        }

        if (item.moveable) {
          if (found === 'bed' && isSleeping) {
            btnMove.classList.add('hidden');
          } else {
            btnMove.classList.remove('hidden');
          }
        } else {
          btnMove.classList.add('hidden');
        }
      } else {
        activeTargetProp = null;
        if (!isOutsideMenuOpen) {
          pop.classList.add('hidden');
        }
      }
    }

    function handleObjectInteract() {
      if (!activeTargetProp) return;
      let map = getCurrentFurnitureMap();
      let item = map[activeTargetProp];

      if (activeEnvironment === 'SALOON') {
        if (activeTargetProp === 'exitHouse') {
          isOutsideMenuOpen = !isOutsideMenuOpen;
          const btnWalk = document.getElementById('btn-act-walk');
          const btnBar = document.getElementById('btn-act-bar');
          const btnTrip = document.getElementById('btn-act-trip');
          const btnWork = document.getElementById('btn-act-work');

          if (isOutsideMenuOpen) {
            document.getElementById('btn-act-main').innerText = "🚪 Chiudi Menu Uscita";
            btnWalk.classList.remove('hidden');
            btnBar.classList.remove('hidden');
            btnTrip.classList.remove('hidden');
            btnWork.classList.remove('hidden');
          } else {
            document.getElementById('btn-act-main').innerText = "🚪 Esci di Casa";
            btnWalk.classList.add('hidden');
            btnBar.classList.add('hidden');
            btnTrip.classList.add('hidden');
            btnWork.classList.add('hidden');
          }
        } else if (item.targetEnv === 'PLAYER_ROOM') {
          let room = roomsState[item.roomIdx];
          if (!room.owner) {
            alert("🔒 Questa stanza è vuota.");
            return;
          }
          currentRoomTitle = `Stanza di ${room.owner}`;
          activeEnvironment = 'PLAYER_ROOM';
          playerPos = { x: 0, y: 120 };
        } else {
          currentRoomTitle = item.title;
          activeEnvironment = item.targetEnv;
          playerPos = { x: 0, y: 120 };
        }
      } else if (activeEnvironment === 'KITCHEN') {
        if (activeTargetProp === 'fridge') {
          fridgeIsOpen = !fridgeIsOpen;
          if (!fridgeIsOpen) hasFoodInInventory = false;
        } else if (activeTargetProp === 'stove') {
          if (hasFoodInInventory && !foodIsCooked) {
            foodIsCooked = true;
            alert("Hai cucinato il cibo! 🍽️");
          } else if (foodIsCooked) {
            hungerLevel = Math.min(100, hungerLevel + 50);
            hasFoodInInventory = false;
            foodIsCooked = false;
            fridgeIsOpen = false;
            alert("Gnam! Fame +50%");
          }
        } else if (activeTargetProp === 'doorExit') {
          activeEnvironment = 'SALOON';
          currentRoomTitle = "Salone Principale";
          playerPos = { x: 0, y: 0 };
        }
      } else if (activeEnvironment === 'BATHROOM') {
        if (activeTargetProp === 'shower') {
          hygieneLevel = 100;
          alert("Doccia completata! 🚿");
        } else if (activeTargetProp === 'doorExit') {
          activeEnvironment = 'SALOON';
          currentRoomTitle = "Salone Principale";
          playerPos = { x: 0, y: 0 };
        }
      } else {
        if (activeTargetProp === 'doorExit') {
          activeEnvironment = 'SALOON';
          currentRoomTitle = "Salone Principale";
          playerPos = { x: 0, y: 0 };
        } else if (activeTargetProp === 'bed') {
          isSleeping = !isSleeping;
          alert(isSleeping ? "Ti sei coricato a letto 🛏️" : "Ti sei svegliato.");
        } else if (activeTargetProp === 'wardrobe') {
          document.getElementById('wardrobe-modal').classList.remove('hidden');
        } else if (activeTargetProp === 'desk') {
          document.getElementById('computer-modal').classList.remove('hidden');
        }
      }
    }

    function doActivity(type) {
      isOutsideMenuOpen = false;
      document.getElementById('pop-interaction').classList.add('hidden');
      document.getElementById('btn-return-home').classList.remove('hidden');

      if (type === 'walk') {
        activeEnvironment = 'ANIM_WALK';
        currentRoomTitle = "Parco Cittadino 🌳";
      } else if (type === 'bar') {
        activeEnvironment = 'ANIM_BAR';
        currentRoomTitle = "Bar all'Aperto ☕";
      } else if (type === 'trip') {
        activeEnvironment = 'ANIM_TRIP';
        currentRoomTitle = "Viaggio ✈️";
      } else if (type === 'work') {
        activeEnvironment = 'ANIM_WORK';
        currentRoomTitle = "Ufficio High-Tech 💼";
      }
      playerPos = { x: 0, y: 0 };
    }

    function returnHomeFromActivity() {
      activeEnvironment = 'SALOON';
      currentRoomTitle = "Salone Principale";
      playerPos = { x: 0, y: 150 };
      document.getElementById('btn-return-home').classList.add('hidden');
    }

    function handleSubAction() {
      if (activeEnvironment === 'KITCHEN' && activeTargetProp === 'fridge' && fridgeIsOpen) {
        hasFoodInInventory = true;
        foodIsCooked = false;
        alert("Hai preso del cibo! 🍎");
        document.getElementById('btn-act-sub').classList.add('hidden');
      }
    }

    function startMovingFurniture() {
      if (!activeTargetProp) return;
      isMovingFurnitureMode = true;
      movingPropKey = activeTargetProp;
      document.getElementById('pop-interaction').classList.add('hidden');
      document.getElementById('btn-place-furniture').classList.remove('hidden');
    }

    function placeFurniture() {
      isMovingFurnitureMode = false;
      movingPropKey = null;
      document.getElementById('btn-place-furniture').classList.add('hidden');
    }

    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function isoProject(x, y, z) {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2 + 20;
      let isoX = (x - y) * 0.866;
      let isoY = (x + y) * 0.5 - z;
      return { x: cx + isoX, y: cy + isoY };
    }

    function drawIsoBlock(x, y, w, h, zHeight, mainColor, topColor, label) {
      let p1 = isoProject(x - w/2, y - h/2, 0);
      let p2 = isoProject(x + w/2, y - h/2, 0);
      let p3 = isoProject(x + w/2, y + h/2, 0);
      let p4 = isoProject(x - w/2, y + h/2, 0);

      let t1 = isoProject(x - w/2, y - h/2, zHeight);
      let t2 = isoProject(x + w/2, y - h/2, zHeight);
      let t3 = isoProject(x + w/2, y + h/2, zHeight);
      let t4 = isoProject(x - w/2, y + h/2, zHeight);

      ctx.strokeStyle = "rgba(0,0,0,0.3)";
      ctx.lineWidth = 1;

      ctx.fillStyle = mainColor;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(p4.x, p4.y);
      ctx.lineTo(t4.x, t4.y); ctx.lineTo(t1.x, t1.y);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = mainColor;
      ctx.beginPath();
      ctx.moveTo(p4.x, p4.y); ctx.lineTo(p3.x, p3.y);
      ctx.lineTo(t3.x, t3.y); ctx.lineTo(t4.x, t4.y);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = topColor;
      ctx.beginPath();
      ctx.moveTo(t1.x, t1.y); ctx.lineTo(t2.x, t2.y);
      ctx.lineTo(t3.x, t3.y); ctx.lineTo(t4.x, t4.y);
      ctx.fill(); ctx.stroke();

      if (label) {
        ctx.fillStyle = "#fff";
        ctx.font = "11px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(label, t4.x, t4.y - 8);
      }
    }

    function drawPlayerAvatar(x, y, name, animTime, avatarColor = "#2e86de") {
      let pPelvis = isoProject(x, y, 22);
      let pNeck = isoProject(x, y, 48);
      let pHead = isoProject(x, y, 62);

      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(0,0,0,0.4)";

      let pFootL = isoProject(x - 6, y, 0);
      let pFootR = isoProject(x + 6, y, 0);

      ctx.fillStyle = "#2c3e50";
      ctx.beginPath();
      ctx.moveTo(pPelvis.x - 3, pPelvis.y); ctx.lineTo(pFootL.x, pFootL.y);
      ctx.lineTo(pFootL.x + 3, pFootL.y); ctx.lineTo(pPelvis.x, pPelvis.y);
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(pPelvis.x + 3, pPelvis.y); ctx.lineTo(pFootR.x, pFootR.y);
      ctx.lineTo(pFootR.x + 3, pFootR.y); ctx.lineTo(pPelvis.x, pPelvis.y);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = avatarColor;
      ctx.beginPath();
      ctx.moveTo(pPelvis.x - 6, pPelvis.y);
      ctx.lineTo(pPelvis.x + 6, pPelvis.y);
      ctx.lineTo(pNeck.x + 8, pNeck.y);
      ctx.lineTo(pNeck.x - 8, pNeck.y);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      let pHandL = isoProject(x - 12, y, 24);
      let pHandR = isoProject(x + 12, y, 24);

      ctx.fillStyle = "#ffdbac";
      ctx.beginPath();
      ctx.moveTo(pNeck.x - 7, pNeck.y + 2); ctx.lineTo(pHandL.x, pHandL.y);
      ctx.lineTo(pHandL.x + 3, pHandL.y + 3); ctx.lineTo(pNeck.x - 4, pNeck.y + 4);
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(pNeck.x + 7, pNeck.y + 2); ctx.lineTo(pHandR.x, pHandR.y);
      ctx.lineTo(pHandR.x + 3, pHandR.y + 3); ctx.lineTo(pNeck.x + 4, pNeck.y + 4);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#ffdbac";
      ctx.beginPath();
      ctx.arc(pHead.x, pHead.y, 9, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      if (name) {
        ctx.fillStyle = "#fff";
        ctx.font = "11px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(name, pHead.x, pHead.y - 14);
      }
    }

    function renderEnvironment(delta, animTime) {
      const speed = isSprinting ? 220 : 130;
      let map = getCurrentFurnitureMap();

      if (!isSleeping) {
        playerPos.x += moveRight * speed * delta;
        playerPos.y -= moveForward * speed * delta;
        playerPos.x = Math.max(-170, Math.min(170, playerPos.x));
        playerPos.y = Math.max(-150, Math.min(150, playerPos.y));
      }

      // Invia la posizione attuale al server online
      if (socket.connected) {
        socket.emit('player_move', {
          id: socket.id,
          name: myData.nick,
          x: playerPos.x,
          y: playerPos.y,
          env: activeEnvironment
        });
      }

      ctx.strokeStyle = "rgba(0,0,0,0.3)";
      ctx.lineWidth = 1;

      let p1 = isoProject(-200, -180, 0);
      let p2 = isoProject(200, -180, 0);
      let p3 = isoProject(200, 180, 0);
      let p4 = isoProject(-200, 180, 0);

      ctx.fillStyle = (activeEnvironment === 'SALOON') ? "#34495e" : "#8e5d38";
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#fff";
      ctx.font = "bold 15px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(currentRoomTitle, canvas.width / 2, 35);

      let targetAnim = fridgeIsOpen ? 1 : 0;
      fridgeAnimProgress += (targetAnim - fridgeAnimProgress) * (delta * 6);

      Object.keys(map).forEach(k => {
        let item = map[k];
        let label = item.name;
        let color = item.color || "#e74c3c";
        let topColor = item.topColor || "#ff6b6b";

        if (activeEnvironment === 'SALOON' && item.roomIdx !== undefined) {
          let room = roomsState[item.roomIdx];
          if (room.owner) {
            label = `🚪 Stanza di ${room.owner}`;
            color = "#2ed573";
            topColor = "#5ded81";
          } else {
            label = `🔒 Stanza Vuota`;
            color = "#718093";
            topColor = "#a4b0be";
          }
        }
        drawIsoBlock(item.x, item.y, item.w, item.h, item.z || 110, color, topColor, label);
      });

      // Disegna te stesso
      drawPlayerAvatar(playerPos.x, playerPos.y, myData.nick, animTime, "#2e86de");

      // Disegna gli altri giocatori online che si trovano nel tuo stesso ambiente
      Object.keys(otherPlayers).forEach(id => {
        let op = otherPlayers[id];
        if (op.env === activeEnvironment) {
          drawPlayerAvatar(op.x, op.y, op.name, animTime, "#e84393");
        }
      });

      checkProximity();
    }

    let lastTime = performance.now();
    let animClock = 0;

    function startLoop() {
      function animate(now) {
        requestAnimationFrame(animate);
        let delta = (now - lastTime) / 1000;
        lastTime = now;
        if (isNaN(delta) || delta > 0.1) delta = 0.016;
        animClock += delta;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        renderEnvironment(delta, animClock);
      }
      requestAnimationFrame(animate);
    }
  </script>
